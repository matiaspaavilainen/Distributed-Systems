apiVersion: v1
kind: Service
metadata:
    name: proxy-node-balancer
    annotations:
        # Optional: explicitly specify the load balancing algorithm
        service.kubernetes.io/service-loadbalancer-mode: "round-robin"
spec:
    type: NodePort
    selector:
        app: proxy-node # This selector will match all proxy nodes
    ports:
        - name: http
          port: 80
          targetPort: http # This will match the named port in proxy node pods
          nodePort: 30080
    sessionAffinity: None # Ensures pure round-robin, no session stickiness
