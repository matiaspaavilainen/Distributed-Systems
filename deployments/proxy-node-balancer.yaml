---
# 1. Keep the ClusterIP service as backend for Ingress
apiVersion: v1
kind: Service
metadata:
    name: proxy-node-service
    annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "80"
spec:
    type: ClusterIP
    selector:
        app: proxy-node
    ports:
        - name: http
          port: 80
          targetPort: http
---
# 2. Create Ingress resource for external access
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: proxy-node-ingress
    annotations:
        # Load balancing configuration
        nginx.ingress.kubernetes.io/load-balance: "round_robin"

        # Enable Prometheus metrics collection
        nginx.ingress.kubernetes.io/enable-metrics: "true"

        # Session handling
        nginx.ingress.kubernetes.io/affinity: "none"

        # Timeouts
        nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
        nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
        nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
spec:
    ingressClassName: nginx
    rules:
        - http:
              paths:
                  - path: /
                    pathType: Prefix
                    backend:
                        service:
                            name: proxy-node-service
                            port:
                                name: http
---
# 3. Configure NodePort on the Ingress Controller (if needed for specific port)
# Note: This is typically configured on the ingress controller deployment itself
apiVersion: v1
kind: Service
metadata:
    name: ingress-nginx-controller
    namespace: ingress-nginx
    annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "10254"
spec:
    type: NodePort
    ports:
        - name: http
          port: 80
          targetPort: 80
          nodePort: 30080
    selector:
        app.kubernetes.io/name: ingress-nginx
        app.kubernetes.io/instance: ingress-nginx
        app.kubernetes.io/component: controller
