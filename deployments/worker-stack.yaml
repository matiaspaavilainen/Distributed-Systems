apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: worker
    labels:
        app: worker
spec:
    serviceName: worker
    replicas: 3
    selector:
        matchLabels:
            app: worker
    template:
        metadata:
            labels:
                app: worker
        spec:
            serviceAccountName: node-manager-account
            affinity:
                nodeAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                        nodeSelectorTerms:
                            - matchExpressions:
                                  - key: node-role.kubernetes.io/worker
                                    operator: Exists
                # one per worker node
                podAntiAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                        - labelSelector:
                              matchLabels:
                                  app: worker
                          topologyKey: "kubernetes.io/hostname"

            containers:
                # MONGODB
                - name: mongodb
                  image: mongodb/mongodb-community-server:latest
                  ports:
                      - containerPort: 27017

                  command: ["/bin/bash", "-c"]
                  args:
                      - |
                          echo "Starting MongoDB setup process..."
                          mkdir -p /data/db

                          # Step 1: Start MongoDB WITHOUT auth
                          echo "Step 1: Starting MongoDB without auth"
                          mongod --replSet rs-$(hostname) --bind_ip_all &
                          MONGO_PID=$!

                          # Wait for MongoDB to be ready
                          sleep 10

                          # Step 2: Initialize replica set
                          echo "Step 2: Initializing replica set"
                          mongosh --eval 'rs.initiate({_id: "rs-" + hostname, members: [{_id: 0, host: "localhost:27017"}]})'

                          # Step 3: Wait for primary
                          echo "Step 3: Waiting for primary election"
                          for i in {1..30}; do
                            if mongosh --quiet --eval "db.isMaster().ismaster" | grep -q "true"; then
                              echo "Primary elected!"
                              break
                            fi
                            echo "Waiting for primary election (attempt $i/30)..."
                            sleep 2
                          done

                          # Step 4: Create admin user
                          echo "Step 4: Creating admin user"
                          mongosh --eval 'use admin; db.createUser({user: "root", pwd: "example", roles: [{role: "root", db: "admin"}]})'

                          # Step 5: Verify user creation
                          echo "Step 5: Verifying user creation"
                          if mongosh --quiet --eval 'db.auth("root", "example")' admin | grep -q "1"; then
                            echo "User verified successfully"
                          else
                            echo "WARNING: User verification failed"
                          fi

                          # Step 6: Create a test database and collection
                          echo "Step 6: Creating test database and collection"
                          mongosh --eval 'use lookupdb; db.test.insertOne({test: true})'

                          # Wait a moment
                          sleep 5

                          echo "MongoDB initialized successfully with auth user"
                          echo "To test: mongosh -u root -p example --authenticationDatabase admin"

                          # Keep container running
                          wait $MONGO_PID

                # ZOOKEEPER
                - name: zookeeper
                  image: bitnami/zookeeper:latest
                  ports:
                      - containerPort: 2181
                  env:
                      - name: ALLOW_ANONYMOUS_LOGIN
                        value: "yes"
                      - name: ZOO_STANDALONE_ENABLED
                        value: "yes"
                      - name: ZOO_MAX_CLIENT_CNXNS
                        value: "2"
                      - name: ZOO_4LW_COMMANDS_WHITELIST
                        value: "srvr,ruok,stat,mntr"
                # KAFKA
                - name: kafka
                  image: bitnami/kafka:latest
                  ports:
                      - containerPort: 9092
                  command: ["/bin/bash", "-c"]
                  args:
                      - |
                          # Extract the pod index from hostname and use it as broker ID
                          BROKER_ID=$(hostname | awk -F'-' '{print $2+1}')
                          echo "Starting Kafka with broker ID: $BROKER_ID"
                          export KAFKA_CFG_BROKER_ID=$BROKER_ID
                          exec /opt/bitnami/scripts/kafka/entrypoint.sh /opt/bitnami/scripts/kafka/run.sh
                  env:
                      - name: KAFKA_CFG_ZOOKEEPER_CONNECT
                        value: "localhost:2181"
                      - name: KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP
                        value: "PLAINTEXT:PLAINTEXT"
                      - name: ALLOW_PLAINTEXT_LISTENER
                        value: "yes"
                      - name: POD_IP
                        valueFrom:
                            fieldRef:
                                fieldPath: status.podIP
                      - name: KAFKA_CFG_LISTENERS
                        value: "PLAINTEXT://0.0.0.0:9092"
                      - name: KAFKA_CFG_ADVERTISED_LISTENERS
                        value: "PLAINTEXT://$(POD_IP):9092"
                # LOOKUP
                - name: lookup
                  image: matiaspaavilainen/distributed-systems:lookup_service
                  imagePullPolicy: Always
                  initContainers:
                      - name: wait-for-mongodb
                        image: mongo:latest
                        command: ["/bin/bash", "-c"]
                        args:
                            - |
                                echo "Waiting for MongoDB to be ready and authenticated..."
                                for i in {1..40}; do
                                  if mongo --quiet -u root -p example --authenticationDatabase admin --eval 'db.serverStatus()' | grep -q "ok"; then
                                    echo "MongoDB is ready and authentication works!"
                                    exit 0
                                  fi
                                  echo "MongoDB not ready yet (attempt $i/40)..."
                                  sleep 3
                                done
                                echo "Failed after 40 attempts"
                                exit 1
                  env:
                      - name: PYTHONPATH
                        value: "/app:/app/kafka_messaging/consumer:/app/kafka_messaging/producer:/app/grpc_sharing/"
                      - name: KAFKA_SERVICE_PORT
                        value: "2050"
                      - name: WORKER_NAME
                        valueFrom:
                            fieldRef:
                                fieldPath: metadata.name
                      - name: MONGO_URL
                        value: "mongodb://root:example@localhost:27017/admin?authSource=admin&directConnection=true"

                - name: kafka-service-lookup
                  image: matiaspaavilainen/distributed-systems:kafka_services
                  imagePullPolicy: Always
                  env:
                      - name: PYTHONPATH
                        value: "/app/consumer:/app/producer"
                      - name: PORT_BASE
                        value: "2050"
                      - name: POD_IP
                        valueFrom:
                            fieldRef:
                                fieldPath: status.podIP
                # NODE MANAGER
                - name: node-manager
                  image: matiaspaavilainen/distributed-systems:node_manager
                  imagePullPolicy: Always
                  # script waits for everything else to be ready, then starts making nodes
                  command: ["bash", "/app/startup.sh"]
                  env:
                      - name: POD_IP
                        valueFrom:
                            fieldRef:
                                fieldPath: status.podIP
                      - name: WORKER_NAME
                        valueFrom:
                            fieldRef:
                                fieldPath: metadata.name

---
# Need to be hardcoded
apiVersion: v1
kind: Service
metadata:
    name: worker-0
spec:
    selector:
        app: worker
        statefulset.kubernetes.io/pod-name: worker-0
    ports:
        - name: kafka
          protocol: TCP
          port: 9092
          targetPort: 9092
        - name: mongodb
          protocol: TCP
          port: 27017
          targetPort: 27017
        - name: lookup
          protocol: TCP
          port: 50051
          targetPort: 50051
    type: ClusterIP
