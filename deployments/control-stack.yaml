apiVersion: apps/v1
kind: Deployment
metadata:
    name: control
    labels:
        app: control
spec:
    replicas: 1
    selector:
        matchLabels:
            app: control
    template:
        metadata:
            labels:
                app: control
        spec:
            tolerations:
                - key: "node-role.kubernetes.io/control-plane"
                  operator: "Exists"
                  effect: "NoSchedule"
                - key: "node-role.kubernetes.io/master"
                  operator: "Exists"
                  effect: "NoSchedule"
                - key: "node.kubernetes.io/control-plane"
                  operator: "Exists"
                  effect: "NoSchedule"
            affinity:
                nodeAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                        nodeSelectorTerms:
                            - matchExpressions:
                                  - key: node-role.kubernetes.io/control-plane
                                    operator: Exists
            containers:
                # ZOOKEEPER
                - name: zookeeper
                  image: bitnami/zookeeper:latest
                  ports:
                      - containerPort: 2181
                  env:
                      - name: ALLOW_ANONYMOUS_LOGIN
                        value: "yes"
                      - name: ZOO_STANDALONE_ENABLED
                        value: "yes"
                      - name: ZOO_MAX_CLIENT_CNXNS # Limit connections
                        value: "2"
                      - name: ZOO_4LW_COMMANDS_WHITELIST # Allow basic commands
                        value: "srvr,ruok,stat,mntr"
                # KAFKA
                - name: kafka
                  image: bitnami/kafka:latest
                  ports:
                      - containerPort: 9092
                  env:
                      - name: POD_NAME
                        valueFrom:
                            fieldRef:
                                fieldPath: metadata.name
                      - name: KAFKA_CFG_ZOOKEEPER_CONNECT
                        value: localhost:2181
                      - name: ALLOW_PLAINTEXT_LISTENER
                        value: "yes"
                      - name: KAFKA_CFG_LISTENERS
                        value: PLAINTEXT://:9092
                      - name: KAFKA_CFG_ADVERTISED_LISTENERS
                        value: PLAINTEXT://localhost:9092
                # MONGODB
                - name: mongodb
                  image: mongo:latest
                  ports:
                      - containerPort: 27017
                  env:
                      - name: MONGO_INITDB_ROOT_USERNAME
                        value: "root"
                      - name: MONGO_INITDB_ROOT_PASSWORD
                        value: "example"
                  volumeMounts:
                      - name: mongo-init
                        mountPath: /docker-entrypoint-initdb.d

                - name: server
                  image: matiaspaavilainen/distributed-systems:main_server
                  imagePullPolicy: Always
                  ports:
                      - containerPort: 40002
                      - containerPort: 40003

                # LOOKUP
                - name: lookup
                  image: matiaspaavilainen/distributed-systems:lookup_service
                  imagePullPolicy: Always
                  env:
                      - name: PYTHONPATH
                        value: "/app:/app/kafka_messaging/consumer:/app/kafka_messaging/producer:/app/grpc_sharing/"
                      - name: KAFKA_SERVICE_PORT
                        value: "2050"

                - name: kafka-service-lookup
                  image: matiaspaavilainen/distributed-systems:kafka_services
                  imagePullPolicy: Always
                  env:
                      - name: PORT_BASE
                        value: "2050"
                      - name: PYTHONPATH
                        value: "/app/consumer:/app/producer"

            volumes:
                - name: mongo-init
                  configMap:
                      name: mongo-init-script
---
apiVersion: v1
kind: Service
metadata:
    name: server-service
spec:
    selector:
        app: control
    ports:
        - protocol: TCP
          port: 40002
          targetPort: 40002
    type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
    name: server-metrics-service
    annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "40003"
        prometheus.io/path: "/metrics"
spec:
    selector:
        app: control
    ports:
        - protocol: TCP
          port: 40003
          targetPort: 40003
    type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
    name: lookup-service-control
spec:
    selector:
        app: control
    ports:
        - protocol: TCP
          port: 50051
          targetPort: 50051
    type: ClusterIP
