apiVersion: apps/v1
kind: Deployment
metadata:
    name: control
    labels:
        app: control
spec:
    replicas: 1
    selector:
        matchLabels:
            app: control
    template:
        metadata:
            labels:
                app: control
        spec:
            tolerations:
                - key: "node-role.kubernetes.io/control-plane"
                  operator: "Exists"
                  effect: "NoSchedule"
                - key: "node-role.kubernetes.io/master"
                  operator: "Exists"
                  effect: "NoSchedule"
                - key: "node.kubernetes.io/control-plane"
                  operator: "Exists"
                  effect: "NoSchedule"
            affinity:
                nodeAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                        nodeSelectorTerms:
                            - matchExpressions:
                                  - key: node-role.kubernetes.io/control-plane
                                    operator: Exists
            containers:
                # MONGODB
                - name: mongodb
                  image: mongo:latest
                  ports:
                      - containerPort: 27017
                  env:
                      - name: MONGO_INITDB_ROOT_USERNAME
                        value: "root"
                      - name: MONGO_INITDB_ROOT_PASSWORD
                        value: "example"
                  volumeMounts:
                      - name: mongo-init
                        mountPath: /docker-entrypoint-initdb.d

                - name: server
                  image: matiaspaavilainen/distributed-systems:main_server
                  imagePullPolicy: Always
                  ports:
                      - containerPort: 40002
                      - containerPort: 40003
            volumes:
                - name: mongo-init
                  configMap:
                      name: mongo-init-script
---
apiVersion: v1
kind: Service
metadata:
    name: server-service
spec:
    selector:
        app: control
    ports:
        - protocol: TCP
          port: 40002
          targetPort: 40002
    type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
    name: server-metrics-service
    labels:
        app: server-metrics-service
    annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "40003"
        prometheus.io/path: "/metrics"
spec:
    selector:
        app: control
    ports:
        - protocol: TCP
          name: metrics
          port: 40003
          targetPort: 40003
    type: ClusterIP
