apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
    name: ingress-controller-monitor
    namespace: monitoring
    labels:
        release: prometheus
spec:
    namespaceSelector:
        matchNames:
            - ingress-nginx
    selector:
        matchLabels:
            app.kubernetes.io/name: ingress-nginx
            app.kubernetes.io/component: controller
    endpoints:
        - targetPort: 10254
          interval: 15s
          scheme: http
