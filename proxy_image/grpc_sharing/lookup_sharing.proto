syntax = "proto3";

package lookup_sharing;

service LookupSharing {
    rpc ReceivePeerUpdate (UpdateRequest) returns (UpdateResponse);
    rpc GetLookupTable (LookupTableRequest) returns (LookupTableResponse);
}

message UpdateRequest {
    string data = 1;
    string type = 2;
    string vector_clock = 3;
}

message UpdateResponse {
    bool success = 1;
}

message LookupTableRequest {
    // Optional parameters for future pagination support
    int32 page_size = 1;
    int32 page = 2;
}

message LookupTableResponse {
    string table_data = 1;  // JSON serialized lookup table
    bool success = 2;
    string error_message = 3;
}